apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-tpu-config
  namespace: tpu-serving-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'tpu-cognition-mesh-cluster'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - tpu-serving-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: tpu-cognition-mesh
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8431  # Default XLA metrics exporter port on TPU VMs
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod_name