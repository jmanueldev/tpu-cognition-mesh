global:
  resolve_timeout: 5m

# The root route defines the default receiver and global grouping behaviors.
route:
  group_by: ['alertname', 'cluster', 'device', 'namespace']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-tpu-notifications'

  routes:
    # 1. High-Priority Route: TPU OOM & Critical Thermal Failures -> PagerDuty + Critical Slack
    - matchers:
        - alertname =~ "TPUOutOfMemory|TPUThermalCritical|TPUDeviceHardwareFailure"
        - severity = "critical"
      receiver: 'pagerduty-and-slack-critical'
      group_wait: 10s       # Fast page time for hardware/oom crises
      repeat_interval: 1h   # Remind on-call hourly until resolved
      continue: false

    # 2. General TPU Route: Warnings, thermal spikes, memory pressure -> Slack only
    - matchers:
        - alertname =~ "TPU.*"
      receiver: 'slack-tpu-notifications'

# Inhibition rules suppress lower-priority alerts when a parent critical alert is active
inhibit_rules:
  - source_matchers:
      - severity = "critical"
      - alertname =~ "TPUThermalCritical|TPUOutOfMemory"
    target_matchers:
      - severity = "warning"
      - alertname =~ "TPUThermalWarning|TPUMemoryPressure"
    equal: ['cluster', 'device', 'node', 'namespace']

receivers:
  # Receiver for Critical TPU OOM & Thermal Events (Pages On-Call + Alerts Slack)
  - name: 'pagerduty-and-slack-critical'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_INTEGRATION_KEY}' # Injected via secret/envsubst
        severity: 'critical'
        client: 'Prometheus TPU Alertmanager'
        class: 'hardware'
        component: 'tpu-accelerator'
        group: '{{ .CommonLabels.cluster }}'
        description: '{{ .CommonLabels.alertname }}: TPU {{ .CommonLabels.device }} in {{ .CommonLabels.namespace }} is failing!'
        details:
          cluster: '{{ .CommonLabels.cluster }}'
          node: '{{ .CommonLabels.node }}'
          device: '{{ .CommonLabels.device }}'
          summary: '{{ .CommonAnnotations.summary }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#tpu-incidents-critical'
        send_resolved: true
        title: '🚨 [CRITICAL] TPU Failure: {{ .CommonLabels.alertname }}'
        text: |
          *Cluster:* `{{ .CommonLabels.cluster }}`
          *Namespace:* `{{ .CommonLabels.namespace }}`
          *Node / Device:* `{{ .CommonLabels.node }}` / `{{ .CommonLabels.device }}`
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* {{ .CommonAnnotations.runbook_url }}
          *Status:* `{{ .Status | toUpper }}`

  # Receiver for General TPU Warning/Informational Alerts (Slack Only)
  - name: 'slack-tpu-notifications'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#tpu-alerts-general'
        send_resolved: true
        title: '⚠️ [WARNING] TPU Alert: {{ .CommonLabels.alertname }}'
        text: |
          *Cluster:* `{{ .CommonLabels.cluster }}`
          *Namespace:* `{{ .CommonLabels.namespace }}`
          *Node / Device:* `{{ .CommonLabels.node }}` / `{{ .CommonLabels.device }}`
          *Description:* {{ .CommonAnnotations.description }}
          *Status:* `{{ .Status | toUpper }}`